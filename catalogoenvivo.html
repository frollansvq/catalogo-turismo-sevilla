<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Turístico de Sevilla</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23970043'/%3E%3Cpath d='M8 22 L16 9 L24 22 Z' fill='none' stroke='%23dfaa00' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 21/09/2026, a petición de Federico:
     1) "quiero poder entrar en cada ficha y ver todo el contenido que está subido, ver también la
        parte de ontología religiosa" -> cada tarjeta se puede abrir (clic, fuera de la foto) en un
        panel de detalle a pantalla completa con TODO lo que tiene la ficha: no solo lo que traía la
        tarjeta resumida, sino también el bloque de turismo religioso completo, MICE, horario y el
        resto de campos — antes esto solo existía dentro de la herramienta de edición (icono de
        ojo), marcado explícitamente como "no se publica"; aquí se hace público a propósito, porque
        es justo lo que ha pedido.
     2) "diseño moderno y chulo... estética del ayuntamiento de Sevilla" -> paleta de color oficial
        del Ayuntamiento de Sevilla (manual de identidad visual, colores corporativos): Albero
        #DFAA00 y Carmesí #970043. No se reproduce el escudo/símbolo NO8DO real (es un símbolo
        heráldico oficial, no algo para recrear a mano en una herramienta interna) — el marcado del
        cabecero de abajo es un motivo geométrico propio, solo inspirado en esos colores. */
  :root{
    --sv-albero:#dfaa00; --sv-albero-deep:#96700a; --sv-albero-soft:#faedc4;
    --sv-carmesi:#970043; --sv-carmesi-deep:#6e0032; --sv-carmesi-soft:#f7dfe9;
    --sv-ink:#1c1712; --sv-ink-soft:#5c5347; --sv-ink-faint:#948a78;
    --sv-ground:#faf6ec; --sv-surface:#fffdf8; --sv-surface-alt:#f2ead9; --sv-line:#e6dcc2;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --sv-albero:#f0c04a; --sv-albero-deep:#f3cf74; --sv-albero-soft:#3a2c0c;
      --sv-carmesi:#e56b9a; --sv-carmesi-deep:#f2a2c0; --sv-carmesi-soft:#3a1420;
      --sv-ink:#f3efe2; --sv-ink-soft:#c7bfae; --sv-ink-faint:#8f8874;
      --sv-ground:#141009; --sv-surface:#1c1710; --sv-surface-alt:#241d13; --sv-line:#3a3120;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sv-ground);color:var(--sv-ink);font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
  a{color:inherit}
  .sv-header{position:relative;background:linear-gradient(120deg,var(--sv-carmesi-deep),var(--sv-carmesi) 55%,var(--sv-albero-deep));color:#fff;overflow:hidden}
  .sv-header::before{content:"";position:absolute;inset:0;opacity:.14;background-image:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 26px),repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 26px);pointer-events:none}
  .sv-header-inner{position:relative;max-width:1120px;margin:0 auto;padding:34px 24px 40px;display:flex;align-items:center;gap:18px}
  .sv-mark{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .sv-eyebrow{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.82)}
  .sv-header h1{font-family:"Manrope",sans-serif;font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 24px 90px}
  .sub{color:var(--sv-ink-faint);font-size:12.8px;margin:0 0 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sub button{font:inherit;font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;border:1px solid var(--sv-line);background:var(--sv-surface);color:var(--sv-ink-soft);cursor:pointer}
  .sub button:hover{background:var(--sv-surface-alt)}
  h2{font-family:"Manrope",sans-serif;font-size:16.5px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--sv-ink-faint);font-weight:500}
  section{margin-bottom:38px}
  .filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px;position:sticky;top:0;background:var(--sv-ground);padding:14px 0 12px;z-index:5}
  .filter-chip{font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:99px;border:1px solid var(--sv-line);background:var(--sv-surface);color:var(--sv-ink-soft);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s,transform .1s}
  .filter-chip:hover{background:var(--sv-surface-alt);transform:translateY(-1px)}
  .filter-chip.active{background:var(--sv-carmesi);border-color:var(--sv-carmesi);color:#fff}
  .filter-chip .n{opacity:.75;font-family:"IBM Plex Mono",monospace;font-size:10.5px;margin-left:4px}
  .quality-panel{position:fixed;top:18px;right:18px;width:270px;max-height:calc(100vh - 36px);overflow-y:auto;overflow-x:hidden;
    background:var(--sv-surface);border:1px solid var(--sv-line);border-radius:14px;padding:14px;
    box-shadow:0 14px 34px -18px rgba(28,23,18,.35);z-index:50}
  .quality-panel-title{font:inherit;font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--sv-carmesi-deep);margin:0 0 4px}
  .quality-panel-hint{font-size:11px;color:var(--sv-ink-faint);line-height:1.4;margin:0 0 10px}
  #qualityPanelList .filter-chip{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;margin-bottom:6px;white-space:normal;width:100%}
  #qualityPanelList .filter-chip span:first-child{flex:1;line-height:1.25}
  #qualityPanelList .filter-chip .n{flex:none}
  @media (max-width: 900px){ .quality-panel{position:static;width:auto;max-height:none;margin:0 0 20px} }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--sv-surface);border:1px solid var(--sv-line);border-radius:16px;padding:16px;overflow:hidden;transition:box-shadow .16s,transform .16s;cursor:pointer}
  .cards .card:hover{box-shadow:0 14px 30px -14px rgba(28,23,18,.32);transform:translateY(-3px);border-color:var(--sv-albero)}
  .card-img{width:calc(100% + 32px);margin:-16px -16px 12px;display:block;height:180px;object-fit:cover;background:var(--sv-surface-alt);cursor:zoom-in}
  .gallery-strip{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
  .card-img-thumb{width:52px;height:52px;flex:none;border-radius:9px;object-fit:cover;cursor:zoom-in;border:1px solid var(--sv-line);background:var(--sv-surface-alt)}
  .card header,.detail-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .card h3{font-family:"Manrope",sans-serif;font-weight:700;font-size:14.8px;margin:0}
  .card-chips{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .desc{font-size:12.8px;color:var(--sv-ink-soft);margin:0 0 10px}
  .chip{font-size:10.8px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none;letter-spacing:.01em}
  .chip.albero{background:var(--sv-albero-soft);color:var(--sv-albero-deep)}
  .chip.carmesi{background:var(--sv-carmesi-soft);color:var(--sv-carmesi)}
  .chip.neutral{background:var(--sv-surface-alt);color:var(--sv-ink-soft);border:1px solid var(--sv-line)}
  dl{margin:0 0 10px;font-size:12.3px}dl div{display:flex;gap:7px;padding:3px 0;align-items:flex-start}dt{color:var(--sv-ink-faint);min-width:110px;flex:none;display:flex;align-items:center;gap:5px}dd{margin:0;word-break:break-word}
  dt svg{flex:none;opacity:.8}
  .mono{font-family:"IBM Plex Mono",monospace;font-size:11px}
  .tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:10.8px;background:var(--sv-surface-alt);border:1px solid var(--sv-line);color:var(--sv-ink-soft);padding:3px 9px;border-radius:99px}
  .translations{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;padding:9px 11px;background:var(--sv-albero-soft);border-radius:9px}
  .translation{font-size:11.5px;color:var(--sv-albero-deep)}.lang-tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:800;background:var(--sv-surface);border:1px solid var(--sv-line);border-radius:4px;padding:1px 4px;margin-right:4px}
  .lightbox{position:fixed;inset:0;background:rgba(15,10,8,.88);display:flex;align-items:center;justify-content:center;padding:26px;z-index:999;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .state-msg{padding:70px 20px;text-align:center;color:var(--sv-ink-faint);font-size:13.5px}
  .state-msg.err{color:var(--sv-carmesi)}
  .spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--sv-line);border-top-color:var(--sv-carmesi);margin:0 auto 14px;animation:cs-spin .8s linear infinite}
  @keyframes cs-spin{to{transform:rotate(360deg)}}

  /* ---- Panel de detalle (ficha completa) ---- */
  .detail-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,10,8,.5);display:flex;justify-content:flex-end}
  .detail-overlay[hidden]{display:none}
  .detail-panel{width:min(680px,100%);max-width:100%;height:100%;background:var(--sv-surface);overflow-y:auto;box-shadow:-24px 0 60px rgba(0,0,0,.28);animation:sv-slide-in .22s ease-out}
  @keyframes sv-slide-in{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
  .detail-hero{position:relative}
  .detail-hero img{width:100%;height:260px;object-fit:cover;display:block;background:var(--sv-surface-alt);cursor:zoom-in}
  .detail-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(20,15,10,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  .detail-close:hover{background:rgba(20,15,10,.75)}
  .detail-gallery{display:flex;gap:6px;padding:12px 24px 0}
  .detail-gallery img{width:64px;height:64px;border-radius:9px;object-fit:cover;cursor:zoom-in;border:1px solid var(--sv-line)}
  .detail-body{padding:20px 24px 60px}
  .detail-body h1{font-family:"Manrope",sans-serif;font-weight:800;font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
  .detail-body .desc{font-size:13.5px}
  .detail-body .desc.long{white-space:pre-wrap}
  .detail-section{margin-top:20px;padding-top:18px;border-top:1px solid var(--sv-line)}
  .detail-section h4{font-family:"Manrope",sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sv-carmesi);margin:0 0 10px}
  .detail-list{margin:0 0 8px;padding-left:18px;font-size:12.8px}.detail-list li{margin-bottom:5px}
  .no-content{color:var(--sv-ink-faint);text-align:center;padding:50px 20px}
</style>
</head>
<body>
<header class="sv-header">
  <div class="sv-header-inner">
    <div class="sv-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 19 12 5 20 19Z" stroke="#dfaa00" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <p class="sv-eyebrow">Oficina de Turismo Inteligente de Sevilla</p>
      <h1>Catálogo Turístico de Sevilla</h1>
    </div>
  </div>
</header>
<div class="wrap">
  <p class="sub" id="subLine">Conectando con la base de datos en directo…</p>
  <div id="content"><div class="state-msg"><div class="spinner"></div>Cargando fichas…</div></div>
</div>
<div class="detail-overlay" id="detailOverlay" hidden>
  <div class="detail-panel" id="detailPanel"></div>
</div>
<aside class="quality-panel" id="qualityPanel" hidden>
  <p class="quality-panel-title">Campos incompletos</p>
  <p class="quality-panel-hint">Solo lo ves tú, con "?admin=1" en el enlace. Recuento de todo el catálogo — clic para ver solo esas fichas.</p>
  <div class="filter-bar" id="qualityPanelList" style="position:static;flex-direction:column;align-items:stretch;background:transparent;padding:0;margin:0"></div>
</aside>
<script>
(function(){
  /* URL del mismo Web App de Apps Script que usa la herramienta de edición (engranaje -> "URL del
     Web App de Apps Script"). Si algún día se vuelve a desplegar y cambia la URL, hay que actualizar
     esta constante y volver a subir el archivo. */
  var DB_URL = "https://script.google.com/macros/s/AKfycbwW8ZUe1aUSYaAJ_3VFZFrYkNeyZ1XvJdYpBiJV2CYcP02yFHdyOxtedB-5x8xx755E/exec";

  var POOLS = [
    {id:"organizacion", label:"Organizaciones turísticas"},
    {id:"otro", label:"Otros recursos turísticos"}
  ];
  var LANGS = [
    {code:"en", label:"Inglés"},
    {code:"fr", label:"Francés"},
    {code:"de", label:"Alemán"}
  ];
  var DIAS_SEMANA = [
    {key:"lunes", label:"Lunes"}, {key:"martes", label:"Martes"}, {key:"miercoles", label:"Miércoles"},
    {key:"jueves", label:"Jueves"}, {key:"viernes", label:"Viernes"}, {key:"sabado", label:"Sábado"}, {key:"domingo", label:"Domingo"}
  ];
  var RELIGIOUS_CURRENT_USE = [
    {code:"ActiveWorship", label:"Culto activo"}, {code:"CulturalVisitOnly", label:"Solo visita cultural"},
    {code:"BothWorshipAndVisit", label:"Culto y visita"}, {code:"Desacralized", label:"Desacralizado"}, {code:"Ruined", label:"En ruinas"}
  ];
  var RELIGIOUS_HERITAGE_STATUS = [
    {code:"UNESCO", label:"UNESCO"}, {code:"BIC", label:"BIC"}, {code:"PatrimonioEuropeo", label:"Patrimonio Europeo"},
    {code:"Catalogado", label:"Catalogado"}, {code:"SinReconocimiento", label:"Sin reconocimiento"}
  ];
  var RELIGIOUS_CONSERVATION_STATUS = [
    {code:"Excelente", label:"Excelente"}, {code:"Bueno", label:"Bueno"}, {code:"Regular", label:"Regular"}, {code:"Deficiente", label:"Deficiente"}
  ];
  /* Igual que en la herramienta de edición: las 7 clases de "Organizaciones turísticas" son una
     lista fija (no se editan desde el engranaje, así que no llegan por la API), mientras que "Otros
     recursos turísticos" sí depende de la configuración guardada en la hoja — ver ORG_CLASSES en
     catalogo-semantico-turismo-sevilla.html, de donde se ha copiado tal cual. */
  var CORE_NS = "https://ontologia.segittur.es/turismo/def/core#";
  var ORG_CLASSES = [
    {code:"AccommodationCompany", label:"Empresa de alojamiento", uri:CORE_NS+"AccommodationCompany"},
    {code:"RestaurantCompany", label:"Empresa de restauración", uri:CORE_NS+"RestaurantCompany"},
    {code:"EventOrganisationCompany", label:"Empresa de organización de eventos", uri:CORE_NS+"EventOrganisationCompany"},
    {code:"ComplementaryActivitiesCompany", label:"Empresa de actividades complementarias", uri:CORE_NS+"ComplementaryActivitiesCompany"},
    {code:"PassengerTransportCompany", label:"Compañía de transporte de viajeros", uri:CORE_NS+"PassengerTransportCompany"},
    {code:"TourismIntermediary", label:"Intermediario turístico", uri:CORE_NS+"TourismIntermediary"},
    {code:"TourGuide", label:"Guía turístico", uri:CORE_NS+"TourGuide"}
  ];
  var state = { records:[], resourceClasses:[], religiousCategories:[], attributeGroups:[] };
  var recordsById = {};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  /* Un enlace de "Compartir" normal de Google Drive (drive.google.com/file/d/ID/view, o /open?id=ID) es
     una página con visor, no la imagen en sí — rota siempre dentro de un <img src>. Se reescribe al
     patrón de miniatura directa de Drive, que sí sirve el archivo. Solo funciona si el archivo está
     compartido como "Cualquier persona con el enlace puede ver"; es un truco no oficial de Google que
     podría dejar de funcionar si Google cambia este comportamiento. */
  function normalizeImgUrl(u){
    if(!u) return u;
    var m = /drive\.google\.com\/file\/d\/([^/?]+)/.exec(u) ||
      /drive\.google\.com\/open\?(?:[^#]*&)?id=([^&]+)/.exec(u) ||
      /drive\.google\.com\/uc\?(?:[^#]*&)?id=([^&]+)/.exec(u) ||
      /drive\.google\.com\/thumbnail\?(?:[^#]*&)?id=([^&]+)/.exec(u);
    if(m && m[1]) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600";
    return u;
  }
  /* 30/08/2026, a petición de Federico: panel de "Campos incompletos" — pero AQUÍ, en el catálogo
     público, no en la herramienta de edición (donde vivía antes). Como esta página la puede abrir
     cualquiera con el enlace, sin usuario ni contraseña, el panel viene OCULTO por defecto y solo
     se muestra si la propia URL lleva "?admin=1" al final — así Federico lo puede consultar
     (guardándose ese enlace especial) sin que se lo encuentre un visitante normal navegando el
     catálogo. Si en algún momento prefieres que se vea siempre, para todo el mundo, dímelo y quito
     esa condición — es una sola línea. Misma lógica que en catalogo-semantico-turismo-sevilla.html
     (MISSING_FIELD_CHECKS), copiada aquí porque este archivo no puede compartir código con aquel. */
  var IS_ADMIN_VIEW = new URLSearchParams(location.search).get("admin") === "1";
  function qBarrioAttrKeys(){
    var g = (state.attributeGroups||[]).filter(function(x){ return x.key === "barrios"; })[0];
    if(g && g.items && g.items.length) return g.items.map(function(it){ return it.key; });
    return null;
  }
  function qMissingBarrio(r){
    var keys = qBarrioAttrKeys();
    var attrs = r.attributes || [];
    if(keys) return !attrs.some(function(a){ return keys.indexOf(a) !== -1; });
    return !attrs.some(function(a){ return a.indexOf("barrio_") === 0; });
  }
  function qMissingNombreEn(r){ var t=(r.translations&&r.translations.en)||{}; return !t.name; }
  function qMissingDescripcionEn(r){ var t=(r.translations&&r.translations.en)||{}; return !t.description; }
  function qMissingClass(r){ return !r.classCode; }
  function qMissingAddress(r){ return !r.street; }
  function qMissingVerificado(r){ return r.estado !== "verificado"; }
  /* No es "campo incompleto" en sentido estricto, es el filtro inverso (a petición de Federico,
     30/08/2026): ver las fichas que SÍ están verificadas, aparte de las que están pendientes.
     Reutiliza el mismo mecanismo de botón/contador que el resto — solo cambia qué cuenta como match. */
  function qVerificadoSi(r){ return r.estado === "verificado"; }
  function qMissingMainImage(r){ return !r.mainImage; }
  function qMissingCoords(r){ return !(r.lat!=null && r.lat!=="" && r.lng!=null && r.lng!==""); }
  /* Accesibilidad: cualquier etiqueta de los grupos "movilidad" (Accesibilidad física) o "sensorial"
     (Accesibilidad sensorial/cognitiva) marcada en la ficha cuenta como "sí tiene selección". */
  function qAccesibilidadAttrKeys(){
    var groups = (state.attributeGroups||[]).filter(function(g){ return g.key==="movilidad" || g.key==="sensorial"; });
    var keys = [];
    groups.forEach(function(g){ (g.items||[]).forEach(function(it){ keys.push(it.key); }); });
    return keys;
  }
  function qMissingAccesibilidad(r){
    var keys = qAccesibilidadAttrKeys();
    var attrs = r.attributes || [];
    if(keys.length) return !attrs.some(function(a){ return keys.indexOf(a) !== -1; });
    return !attrs.some(function(a){ return a.indexOf("mov_")===0 || a.indexOf("sen_")===0; });
  }
  var MISSING_FIELD_CHECKS = [
    {key:"nombreEn", label:"Nombre en inglés", test:qMissingNombreEn},
    {key:"descripcionEn", label:"Descripción en inglés", test:qMissingDescripcionEn},
    {key:"categoria", label:"Categoría o clase seleccionada", test:qMissingClass},
    {key:"direccion", label:"Dirección", test:qMissingAddress},
    {key:"barrio", label:"Barrio por definir", test:qMissingBarrio},
    {key:"imagenCabecera", label:"Imagen de cabecera (enlace)", test:qMissingMainImage},
    {key:"coordenadas", label:"Coordenadas (lat/lng)", test:qMissingCoords},
    {key:"accesibilidad", label:"Sin ninguna selección de accesibilidad", test:qMissingAccesibilidad},
    {key:"verificado", label:"Sin verificar (pendientes)", test:qMissingVerificado},
    {key:"verificadoSi", label:"Verificadas", test:qVerificadoSi}
  ];
  function missingKeysFor(r){
    return MISSING_FIELD_CHECKS.filter(function(c){ return c.test(r); }).map(function(c){ return c.key; });
  }
  function poolLabel(id){ var p=POOLS.filter(function(x){return x.id===id;})[0]; return p?p.label:id; }
  function formatAddress(r){
    var line = [r.street, r.number].filter(Boolean).join(", ");
    if(r.postalCode) line = (line?line+" · ":"")+r.postalCode;
    return line;
  }
  function hasCoords(r){ return r.lat!=null && r.lat!=="" && r.lng!=null && r.lng!==""; }
  function mapsUrl(r){ return "https://www.google.com/maps?q="+encodeURIComponent(r.lat)+","+encodeURIComponent(r.lng); }
  function classesForPool(pool){ return pool==="organizacion" ? ORG_CLASSES : state.resourceClasses; }
  function classInfo(pool, code){
    var list = classesForPool(pool);
    for(var i=0;i<list.length;i++){ if(list[i].code===code) return list[i]; }
    return null;
  }
  function allAttrItems(){
    var out=[];
    (state.attributeGroups||[]).forEach(function(g){ (g.items||[]).forEach(function(it){ out.push({key:it.key, label:it.label}); }); });
    return out;
  }
  function attrLabel(key){
    var found = allAttrItems().filter(function(a){return a.key===key;})[0];

  }

      r.estatusPatrimonialReligioso ? "Estatus patrimonial: "+codeLabel_(RELIGIOUS_HERITAGE_STATUS, r.estatusPatrimonialReligioso) : "",
      r.estadoConservacion ? "Conservación: "+codeLabel_(RELIGIOUS_CONSERVATION_STATUS, r.estadoConservacion) : ""

  function openLightbox(src, container){
    var box = document.createElement("div"); box.className = "lightbox";
    var big = document.createElement("img"); big.src = src; box.appendChild(big);
    box.addEventListener("click", function(){ box.remove(); });
    (container || document.body).appendChild(box);
  }

  function openDetail(id, pushHash){
    var r = recordsById[id];
    if(!r) return;
    document.getElementById("detailPanel").innerHTML = recordDetailHtml(r);
    document.getElementById("detailOverlay").hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("detailPanel").scrollTop = 0;
    document.getElementById("detailCloseBtn").addEventListener("click", closeDetail);
    document.getElementById("detailPanel").querySelectorAll(".detail-hero img, .detail-gallery img").forEach(function(img){
      img.addEventListener("click", function(){ openLightbox(img.src, document.getElementById("detailPanel")); });
    });
    if(pushHash !== false) location.hash = "f=" + id;
  }
  function closeDetail(clearHash){
    document.getElementById("detailOverlay").hidden = true;
    document.body.style.overflow = "";
    if(clearHash !== false && location.hash) history.pushState("", document.title, location.pathname + location.search);
  }
  document.getElementById("detailOverlay").addEventListener("click", function(e){ if(e.target===e.currentTarget) closeDetail(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !document.getElementById("detailOverlay").hidden) closeDetail(); });
  window.addEventListener("hashchange", function(){
    var m = /f=([^&]+)/.exec(location.hash);
    if(m && recordsById[decodeURIComponent(m[1])]) openDetail(decodeURIComponent(m[1]), false);
    else closeDetail(false);
  });

  function renderCatalog(records){
    recordsById = {};
    records.forEach(function(r){ recordsById[r.id] = r; });
    var byPool = {};
    POOLS.forEach(function(p){ byPool[p.id] = records.filter(function(r){return r.pool===p.id;}); });
    var classCounts = {}, classOrder = [];
    records.forEach(function(r){
      var ci = classInfo(r.pool, r.classCode);
      var label = (ci ? ci.label : r.classLabel) || "Sin categoría";
      if(classCounts[label]===undefined){ classCounts[label]=0; classOrder.push(label); }
      classCounts[label]++;
    });
    classOrder.sort(function(a,b){ return classCounts[b]-classCounts[a] || a.localeCompare(b,"es"); });
    var filterBarHtml = '<div class="filter-bar" id="csFilterBar">'+
      '<button type="button" class="filter-chip active" data-filterclass="">Todas <span class="n">'+records.length+'</span></button>'+
      classOrder.map(function(label){
        return '<button type="button" class="filter-chip" data-filterclass="'+esc(label)+'">'+esc(label)+' <span class="n">'+classCounts[label]+'</span></button>';
      }).join("")+'</div>';
    function section(pool){
      var recs = byPool[pool];
      if(!recs.length) return "";
      var chipClass = pool==="organizacion"?"albero":"neutral";
      var rows = recs.map(function(r){
        var ci = classInfo(r.pool, r.classCode);
        var label = (ci ? ci.label : r.classLabel) || "Sin categoría";
        return recordCardHtml(r, chipClass, label);
      }).join("");
      return '<section data-poolsection="'+esc(pool)+'"><h2>'+esc(poolLabel(pool))+' <span class="count">'+recs.length+'</span></h2><div class="cards">'+rows+'</div></section>';
    }
    var content = document.getElementById("content");
    if(!records.length){
      content.innerHTML = '<div class="state-msg">Todavía no hay fichas publicadas en el catálogo.</div>';
      return;
    }
    content.innerHTML = filterBarHtml + section("organizacion") + section("otro");
    var bar = document.getElementById("csFilterBar");
    /* Dos filtros independientes que se combinan a la vez (categoría + campos incompletos, este
       último solo visible en modo admin) — una ficha se ve si cumple los dos a la vez. */
    function applyFilters(){
      var classBtn = bar.querySelector(".filter-chip.active");
      var wantedClass = classBtn ? classBtn.getAttribute("data-filterclass") : "";
      var qList = document.getElementById("qualityPanelList");
      var missingBtn = qList ? qList.querySelector(".filter-chip.active") : null;
      var wantedMissing = missingBtn ? missingBtn.getAttribute("data-missing") : "";
      content.querySelectorAll(".card").forEach(function(card){
        var showClass = !wantedClass || card.getAttribute("data-cardclass")===wantedClass;
        var missingKeys = (card.getAttribute("data-missing")||"").split(" ");
        var showMissing = !wantedMissing || missingKeys.indexOf(wantedMissing) !== -1;
        card.style.display = (showClass && showMissing) ? "" : "none";
      });
      content.querySelectorAll("section[data-poolsection]").forEach(function(sec){
        var anyVisible = Array.prototype.some.call(sec.querySelectorAll(".card"), function(c){ return c.style.display!=="none"; });
        sec.style.display = anyVisible ? "" : "none";
      });
    }
    bar.addEventListener("click", function(e){
      var btn = e.target.closest(".filter-chip"); if(!btn) return;
      bar.querySelectorAll(".filter-chip").forEach(function(b){ b.classList.toggle("active", b===btn); });
      applyFilters();
    });
    if(IS_ADMIN_VIEW){
      var qPanel = document.getElementById("qualityPanel");
      var qList = document.getElementById("qualityPanelList");
      qPanel.hidden = false;
      qList.innerHTML = '<button type="button" class="filter-chip active" data-missing=""><span>Todas</span></button>'+
        MISSING_FIELD_CHECKS.map(function(c){
          var n = records.filter(c.test).length;
          return '<button type="button" class="filter-chip" data-missing="'+esc(c.key)+'"><span>'+esc(c.label)+'</span><span class="n">'+n+'</span></button>';
        }).join("");
      qList.addEventListener("click", function(e){
        var btn = e.target.closest(".filter-chip"); if(!btn) return;
        qList.querySelectorAll(".filter-chip").forEach(function(b){ b.classList.toggle("active", b===btn); });
        applyFilters();
      });
    }
    /* Clic en una imagen de la tarjeta -> lupa. Clic en cualquier otra parte de la tarjeta -> abre
       el panel de detalle completo (21/09/2026, a petición de Federico: "quiero poder entrar en
       cada ficha y ver todo el contenido que está subido"). El enlace del mapa lleva su propio
       stopPropagation() para que no abra el panel por encima al pinchar en él. */
    content.addEventListener("click", function(e){
      var img = e.target.closest(".card-img, .card-img-thumb");
      if(img){ openLightbox(img.src, img.closest(".card")); return; }
      var link = e.target.closest("a"); if(link) return; // dejar que los enlaces normales funcionen
      var card = e.target.closest(".card");
      if(card) openDetail(card.getAttribute("data-recordid"));
    });
    // Si la URL ya trae #f=<id> al cargar (enlace directo a una ficha), abrirla de una vez.
    var m = /f=([^&]+)/.exec(location.hash);
    if(m && recordsById[decodeURIComponent(m[1])]) openDetail(decodeURIComponent(m[1]), false);
  }

  function fmtHora(d){ return d.toLocaleString("es-ES"); }
  function setSubLine(html){ document.getElementById("subLine").innerHTML = html; }

  function cargar(){
    document.getElementById("content").innerHTML = '<div class="state-msg"><div class="spinner"></div>Cargando fichas…</div>';
    setSubLine("Conectando con la base de datos en directo…");
    fetch(DB_URL + (DB_URL.indexOf("?")===-1 ? "?" : "&") + "action=all", {method:"GET"})
      .then(function(res){
        if(!res.ok){ var e = new Error("HTTP "+res.status); e.httpStatus = res.status; throw e; }
        return res.text();
      })
      .then(function(text){
        var data;
        try{ data = JSON.parse(text); }
        catch(parseErr){
          var e2 = new Error("La respuesta no es JSON — empieza así: «"+text.slice(0,120)+"»");
          e2.notJson = true;
          throw e2;
        }
        if(!data || data.ok !== true) throw new Error((data && data.error) || "Respuesta inválida de la base de datos");
        return data;
      })
      .then(function(data){
        state.records = Array.isArray(data.records) ? data.records : [];
        if(Array.isArray(data.resourceClasses)) state.resourceClasses = data.resourceClasses;
        if(Array.isArray(data.religiousCategories)) state.religiousCategories = data.religiousCategories;
        if(Array.isArray(data.attributeGroups)) state.attributeGroups = data.attributeGroups;
        renderCatalog(state.records);
        setSubLine('Datos en directo · actualizado a las '+esc(fmtHora(new Date()))+' · '+state.records.length+' fichas '+
          '<button type="button" id="refreshBtn">↻ Actualizar</button>');
        document.getElementById("refreshBtn").addEventListener("click", cargar);
      })
      .catch(function(err){
        var msg;
        if(err && err.notJson){
          msg = "El Web App respondió, pero no con datos (JSON). Lo más probable es que el despliegue de Apps Script no tenga acceso «Cualquier usuario» — sin eso, un visitante que no sea del equipo no puede ver el catálogo. Revisa en Apps Script → Implementar → Gestionar implementaciones.";
        } else if(err && err.httpStatus){
          msg = "El servidor respondió con un error (HTTP "+err.httpStatus+"). Puede que el despliegue esté caído o mal configurado.";
        } else {
          msg = "No se ha podido conectar con la base de datos en directo ("+esc((err && err.message) || String(err))+"). Puede ser un problema de conexión, o que el despliegue de Apps Script no permita el acceso público.";
        }
        document.getElementById("content").innerHTML = '<div class="state-msg err">⚠ '+msg+'</div>';
        setSubLine('No se ha podido cargar <button type="button" id="refreshBtn">↻ Reintentar</button>');
        document.getElementById("refreshBtn").addEventListener("click", cargar);
      });
  }

  cargar();
})();
</script>
</body>
</html>
